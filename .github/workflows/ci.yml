name: VOXIS checks

on:
  push:
    branches: [main, Swayam]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -B -m pytest -p no:cacheprovider
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Audit installed dependencies
        run: python -m pip_audit

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend lockfile
        working-directory: frontend
        run: npm audit --audit-level=high --package-lock-only

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked generated bytecode and private files
        shell: bash
        run: |
          private_files=()
          while IFS= read -r file; do
            case "$file" in
              .env.example|*/.env.example) continue ;;
              .env|*/.env|.env.*|*/.env.*|*.pyc|*.pyo|*.pem|*.key|*.crt)
                private_files+=("$file") ;;
            esac
          done < <(git ls-files)
          if ((${#private_files[@]})); then
            printf 'Disallowed tracked files:\n%s\n' "${private_files[@]}"
            exit 1
          fi
      - name: Scan reachable history for common secret formats
        shell: bash
        run: |
          pattern='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)'
          while read -r commit; do
            if git grep -n -I -E "$pattern" "$commit" -- .; then
              echo "A known secret pattern was found in $commit" >&2
              exit 1
            fi
          done < <(git rev-list --all)
